[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antimatter-core"
version = "0.1.0"
description = "Sovereign, 100% offline agentic AI software engineering platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Antimatter Architecture Team" }
]
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "fastembed>=0.3.0",
    "aiosqlite>=0.20.0",
    "tree-sitter>=0.21.3",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "sqlite-vec>=0.1.6",
    "rich>=13.7.0",
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.4"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.4.0",
    "ruff>=0.4.0"
]
audio = [
    "faster-whisper>=1.0.0",
    "onnxruntime>=1.18.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0"
]
llama_cpp = [
    "llama-cpp-python>=0.2.75"
]

[project.scripts]
antimatter = "antimatter.cli:main"

[tool.setuptools.packages.find]
include = ["antimatter*"]

